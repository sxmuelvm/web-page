
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skates</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <h1>Skates</h1>

        <p class="descripcion">
            Descubre nuestra colección de skates.
            Diseñados para disfrutar de cada recorrido.
        </p>

        <section class="skates">

            <div class="skate">
                <img src="images/skate1.jpg" alt="Skate negro">

                <h2>Skate Street</h2>

                <p>
                    Un skate ideal para recorrer la ciudad
                    y practicar tus trucos.
                </p>
            </div>


            <div class="skate">
                <img src="images/skate2.jpg" alt="Skate azul">

                <h2>Skate Ocean</h2>

                <p>
                    Diseño moderno y resistente para
                    disfrutar de cada recorrido.
                </p>
            </div>

        </section>

    </main>

</body>

</html>
